name: Java Spring Boot Gradle CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Lint, Test, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Step 1 - Check syntax & Compile
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew compileJava
          else
            gradle compileJava
          fi

      - name: Step 2 - Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew test
          else
            gradle test
          fi

      - name: Step 3 - Package Application (bootJar)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bootJar
          else
            gradle bootJar
          fi

      - name: Step 4 - Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-gradle-api-jar
          path: build/libs/*.jar
          retention-days: 7
